name: Build Meesho APK

on:
  workflow_dispatch:
  push:
    branches: [main, dev, ci]
    paths:
      - "manager/**"
      - ".github/workflows/build-meesho-apk.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "manager/**"
      - ".github/workflows/build-meesho-apk.yml"

permissions:
  contents: read

concurrency:
  group: meesho-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages required by this project
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Verify Gradle wrapper
        working-directory: manager
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Meesho release APK
        working-directory: manager
        env:
          KSU_PACKAGE_NAME: com.messho.supply
          KSU_NAME: Meesho
        run: |
          ./gradlew --no-daemon --stacktrace clean assembleRelease \
            -PKSU_PACKAGE_NAME="$KSU_PACKAGE_NAME" \
            -PKSU_NAME="$KSU_NAME"

      - name: Verify APK output
        run: |
          APK_DIR="manager/app/build/outputs/apk/release"
          test -d "$APK_DIR"
          find "$APK_DIR" -type f -name "*.apk" -print -quit | grep -q .
          ls -lh "$APK_DIR"/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Meesho-APK-${{ github.run_number }}
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Meesho-build-reports-${{ github.run_number }}
          path: |
            manager/app/build/reports/
            manager/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
